[build]
  command = "npm run build"
  publish = "dist/client"

# Netlify TanStack Start plugin outputs functions here
[functions]
  directory = ".netlify/v1/functions"

# Caching strategy.
# Rules are applied top-to-bottom; a later match overrides the same header key.
# 1) HTML documents must never be cached: they reference hashed asset URLs that
#    change on every deploy. A stale cached HTML pointing at a purged asset hash
#    is what caused the "unstyled site" bug.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# 2) Hashed build assets are content-addressed and immutable: cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3) En-têtes de sécurité.
# Clés distinctes de Cache-Control : les blocs ci-dessus ne les écrasent pas.
[[headers]]
  for = "/*"
  [headers.values]
    # Empêche l'encadrement du site par un tiers (clickjacking). SAMEORIGIN
    # plutôt que DENY : /contact intègre déjà une iframe interne.
    X-Frame-Options = "SAMEORIGIN"
    # Interdit au navigateur de deviner un type MIME différent de celui servi.
    X-Content-Type-Options = "nosniff"
    # Ne fuite pas l'URL complète (chemins de deck client, params) vers l'externe.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Le site n'utilise ni caméra, ni micro, ni géoloc : on les coupe.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Force le HTTPS côté navigateur (les redirects 301 ne protègent pas la
    # toute première requête). Pas de `preload` : c'est quasi irréversible.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# 3 bis) Decks clients : noindex au niveau HTTP.
# Les 4 pages /cadrage/* servent déjà `<meta name="robots" content="noindex,
# nofollow">` en SSR. Cet en-tête le double au niveau protocole : il couvre
# les réponses non-HTML (un PDF de deck servi sous /cadrage/ ne peut pas
# porter de balise meta).
# Ces pages ne sont plus bloquées dans robots.txt pour les moteurs — c'est
# volontaire et nécessaire : une page interdite au crawl ne peut pas être lue,
# donc son noindex n'est jamais vu. Voir le commentaire de public/robots.txt.
[[headers]]
  for = "/cadrage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 4) CSP en Report-Only d'abord.
# Une CSP trop stricte casse le site en silence, et les en-têtes netlify.toml
# ne sont pas testables en `vite dev`. On observe les violations en console
# après déploiement, puis on renomme la clé en `Content-Security-Policy`.
# `unsafe-inline` sur script-src est requis par l'hydratation TanStack Start.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.calendly.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://calendly.com; frame-src https://calendly.com; form-action 'self'"

# TanStack Start on Netlify runs via a serverless function.
# SEO: redirect legacy URLs (previous site/blog) so Google doesn't see 404.
[[redirects]]
  from = "http://www.peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

# /developpement-web visait l'accueil : Google traite une redirection vers une
# page hors sujet comme un soft 404, et le signal de l'ancienne URL est perdu.
# /sites-web EST la page service developpement web (elle porte deja la paire
# hreflang avec /en/web-development), donc c'est la cible legitime. Pas de page
# /developpement-web dediee : elle cannibaliserait /sites-web sur la meme requete.
[[redirects]]
  from = "/developpement-web"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/developpement-web/*"
  to = "/sites-web"
  status = 301
  force = true

# Other legacy pages spotted in Search Console export
# /react/* etait une categorie d'articles de l'ancien blog : le hub editorial
# /conseils est la cible thematiquement la plus proche, pas l'accueil.
[[redirects]]
  from = "/react/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/qui-suis-je"
  status = 301
  force = true

[[redirects]]
  from = "/qui-suis-je.html"
  to = "/qui-suis-je"
  status = 301
  force = true

[[redirects]]
  from = "/chess.html"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio"
  status = 301
  force = true

# NOTE: pas de redirection sur /politique-confidentialite. La page existe
# desormais (src/routes/politique-confidentialite.tsx). Le 301 vers l'accueil
# qui vivait ici etait doublement fautif : Google le lisait comme un soft 404,
# et l'obligation d'information de l'article 13 du RGPD n'etait plus remplie.
# Ne jamais rediriger une page legale vers l'accueil.

# Anciennes URL de blog datees (/conseils/2025/04/18/hebergement).
#
# ATTENTION : ne PAS ecrire `from = "/conseils/*"` vers `/conseils`. Le splat
# Netlify matche aussi le chemin nu `/conseils`, la regle boucle sur elle-meme
# et Netlify la desactive en silence — c'est pourquoi ces URL renvoyaient encore
# 404 en production alors que la regle existait depuis des mois.
# Les placeholders `:a` exigent un segment non vide : pas de boucle possible.
[[redirects]]
  from = "/conseils/:a"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/conseils/:a/*"
  to = "/conseils"
  status = 301
  force = true

# NOTE: pas de redirection sur /contact. La page existe (src/routes/contact.tsx),
# porte le NAP local (téléphone, email, Gilly-sur-Isère) et sa propre canonical.
# Le 301 vers /reservation-appel qui vivait ici la rendait inaccessible :
# Search Console la classait « autre page avec balise canonique correcte »
# alors qu'elle est déclarée dans le sitemap. Ne pas le réintroduire.

[[redirects]]
  from = "/brief"
  to = "/reservation-appel"
  status = 301
  force = true

[[redirects]]
  from = "/bienvenue-strategie"
  to = "/bienvenue"
  status = 301
  force = true

# Guides linked from /bienvenue (canonical + sitemap use /ressources/…)
# NOTE: les anciennes URL d'offres visaient /packs, qui redirige lui-même vers
# /services (src/routes/packs.tsx). Elles pointent maintenant directement sur
# /services : un seul saut, pas de chaîne 301 → 301 à faire suivre par Google.
[[redirects]]
  from = "/ressources/systeme"
  to = "/ressources-systeme"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/site"
  to = "/ressources-site"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/confiance"
  to = "/ressources-confiance"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/conversion"
  to = "/ressources-conversion"
  status = 301
  force = true

# Anciennes URL d'offres. Elles visaient /packs, qui redirige lui-meme vers
# /services : on evite la chaine 301 -> 301 en pointant la cible finale.
# Chacune vise la page la plus proche de son intention d'origine plutot que le
# hub generique : une redirection vers une page hors sujet est traitee par
# Google comme un soft 404 et ne transmet pas le signal de l'ancienne URL.
[[redirects]]
  from = "/graphisme"
  to = "/design"
  status = 301
  force = true

[[redirects]]
  from = "/graphisme.html"
  to = "/design"
  status = 301
  force = true

[[redirects]]
  from = "/creation-site-vitrine"
  to = "/sites-web"
  status = 301
  force = true

# 404 relevee dans Search Console (dernier crawl 12/07/2026) : aucune regle ne
# la couvrait, contrairement a sa jumelle /creation-site-vitrine.
[[redirects]]
  from = "/creation-site-ecommerce"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/maintenance-site-web"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/maintenance-site-web.html"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/packs"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/developpement-web.html"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# Anciennes URL editoriales (categorie + archives datees). Toutes vers le hub
# /conseils : c'est le contenu qui a remplace ces articles. Rediriger vers "/"
# faisait perdre le signal thematique de chaque ancienne URL.
[[redirects]]
  from = "/web-strategy/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/2025/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/2026/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

