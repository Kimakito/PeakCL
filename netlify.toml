[build]
  command = "npm run build"
  publish = "dist/client"
  # Valeur par défaut de Netlify, déclarée explicitement : c'est de ce dossier
  # que viennent les en-têtes de sécurité (voir la section 3 plus bas).
  edge_functions = "netlify/edge-functions"

# Netlify TanStack Start plugin outputs functions here
[functions]
  directory = ".netlify/v1/functions"

# Caching strategy.
# Rules are applied top-to-bottom; a later match overrides the same header key.
# 1) HTML documents must never be cached: they reference hashed asset URLs that
#    change on every deploy. A stale cached HTML pointing at a purged asset hash
#    is what caused the "unstyled site" bug.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# 2) Hashed build assets are content-addressed and immutable: cache forever.
# Ces deux chemins sont exclus de l'edge function (voir plus bas) pour ne pas
# l'invoquer sur chaque fichier d'un chargement de page : ils portent donc leur
# nosniff ici. Aucune autre clé de sécurité n'est nécessaire sur un .js ou un
# .woff2, qui ne sont pas des documents.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# 3) En-têtes de sécurité et X-Robots-Tag : DÉPLACÉS.
#
# Ils vivaient ici, en `[[headers]]`, et ne s'appliquaient à AUCUNE page HTML.
# Raison : ces blocs ne couvrent que les fichiers servis par le CDN, or le site
# entier est rendu par la fonction SSR TanStack Start. Constaté en production le
# 17/08/2026 — `/robots.txt` portait bien CSP, X-Frame-Options, Referrer-Policy
# et Permissions-Policy, `/` et `/cadrage/*` n'en portaient aucun. Les seules
# réponses qu'on cherchait à protéger étaient les seules non couvertes, et le
# garde-fou noindex des decks clients ne s'appliquait pas.
#
# Ils sont désormais posés par `netlify/edge-functions/security-headers.ts`, qui
# s'exécute devant l'origine et couvre donc le HTML SSR comme le statique.
# NE PAS les réintroduire ici : deux sources pour la même clé divergent toujours.
# Vérification après déploiement : `npm run headers:check`.

# TanStack Start on Netlify runs via a serverless function.
# SEO: redirect legacy URLs (previous site/blog) so Google doesn't see 404.
[[redirects]]
  from = "http://www.peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.peakcl.com/*"
  to = "https://peakcl.com/:splat"
  status = 301
  force = true

# /developpement-web visait l'accueil : Google traite une redirection vers une
# page hors sujet comme un soft 404, et le signal de l'ancienne URL est perdu.
# /sites-web EST la page service developpement web (elle porte deja la paire
# hreflang avec /en/web-development), donc c'est la cible legitime. Pas de page
# /developpement-web dediee : elle cannibaliserait /sites-web sur la meme requete.
[[redirects]]
  from = "/developpement-web"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/developpement-web/*"
  to = "/sites-web"
  status = 301
  force = true

# Other legacy pages spotted in Search Console export
# /react/* etait une categorie d'articles de l'ancien blog : le hub editorial
# /conseils est la cible thematiquement la plus proche, pas l'accueil.
[[redirects]]
  from = "/react/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/qui-suis-je"
  status = 301
  force = true

[[redirects]]
  from = "/qui-suis-je.html"
  to = "/qui-suis-je"
  status = 301
  force = true

[[redirects]]
  from = "/chess.html"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio"
  status = 301
  force = true

# NOTE: pas de redirection sur /politique-confidentialite. La page existe
# desormais (src/routes/politique-confidentialite.tsx). Le 301 vers l'accueil
# qui vivait ici etait doublement fautif : Google le lisait comme un soft 404,
# et l'obligation d'information de l'article 13 du RGPD n'etait plus remplie.
# Ne jamais rediriger une page legale vers l'accueil.

# Anciennes URL de blog datees (/conseils/2025/04/18/hebergement).
#
# ATTENTION : ne PAS ecrire `from = "/conseils/*"` vers `/conseils`. Le splat
# Netlify matche aussi le chemin nu `/conseils`, la regle boucle sur elle-meme
# et Netlify la desactive en silence — c'est pourquoi ces URL renvoyaient encore
# 404 en production alors que la regle existait depuis des mois.
# Les placeholders `:a` exigent un segment non vide : pas de boucle possible.
[[redirects]]
  from = "/conseils/:a"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/conseils/:a/*"
  to = "/conseils"
  status = 301
  force = true

# NOTE: pas de redirection sur /contact. La page existe (src/routes/contact.tsx),
# porte le NAP local (téléphone, email, Gilly-sur-Isère) et sa propre canonical.
# Le 301 vers /reservation-appel qui vivait ici la rendait inaccessible :
# Search Console la classait « autre page avec balise canonique correcte »
# alors qu'elle est déclarée dans le sitemap. Ne pas le réintroduire.

[[redirects]]
  from = "/brief"
  to = "/reservation-appel"
  status = 301
  force = true

[[redirects]]
  from = "/bienvenue-strategie"
  to = "/bienvenue"
  status = 301
  force = true

# Guides linked from /bienvenue (canonical + sitemap use /ressources/…)
# NOTE: les anciennes URL d'offres visaient /packs, qui redirige lui-même vers
# /services (src/routes/packs.tsx). Elles pointent maintenant directement sur
# /services : un seul saut, pas de chaîne 301 → 301 à faire suivre par Google.
[[redirects]]
  from = "/ressources/systeme"
  to = "/ressources-systeme"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/site"
  to = "/ressources-site"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/confiance"
  to = "/ressources-confiance"
  status = 301
  force = true

[[redirects]]
  from = "/ressources/conversion"
  to = "/ressources-conversion"
  status = 301
  force = true

# Anciennes URL d'offres. Elles visaient /packs, qui redirige lui-meme vers
# /services : on evite la chaine 301 -> 301 en pointant la cible finale.
# Chacune vise la page la plus proche de son intention d'origine plutot que le
# hub generique : une redirection vers une page hors sujet est traitee par
# Google comme un soft 404 et ne transmet pas le signal de l'ancienne URL.
[[redirects]]
  from = "/graphisme"
  to = "/design"
  status = 301
  force = true

[[redirects]]
  from = "/graphisme.html"
  to = "/design"
  status = 301
  force = true

[[redirects]]
  from = "/creation-site-vitrine"
  to = "/sites-web"
  status = 301
  force = true

# Variante .html de l'ancienne URL. Elle renvoyait 404 alors que sa jumelle
# sans extension etait couverte : l'ancien site servait les deux formes, donc
# les deux existent dans l'index et dans les backlinks. Meme oubli que celui
# corrige plus haut pour /creation-site-ecommerce.
[[redirects]]
  from = "/creation-site-vitrine.html"
  to = "/sites-web"
  status = 301
  force = true

# 404 relevee dans Search Console (dernier crawl 12/07/2026) : aucune regle ne
# la couvrait, contrairement a sa jumelle /creation-site-vitrine.
[[redirects]]
  from = "/creation-site-ecommerce"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/maintenance-site-web"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/maintenance-site-web.html"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/packs"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/developpement-web.html"
  to = "/sites-web"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# Anciennes URL editoriales (categorie + archives datees). Toutes vers le hub
# /conseils : c'est le contenu qui a remplace ces articles. Rediriger vers "/"
# faisait perdre le signal thematique de chaque ancienne URL.
[[redirects]]
  from = "/web-strategy/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/2025/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/2026/*"
  to = "/conseils"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

