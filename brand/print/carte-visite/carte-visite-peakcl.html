<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de visite — PeakCL · Charlotte Lacroix</title>
<!--
  Carte de visite PeakCL — 85 x 55 mm + 3 mm de fond perdu (page 91 x 61 mm).
  Page 1 = recto (fond indigo) · Page 2 = verso (fond crème).
  Export : Chrome > Imprimer > Enregistrer au format PDF, marges "aucune",
  "Graphiques d'arrière-plan" coché, échelle 100 %.
-->
<link rel="stylesheet" href="../assets/fonts.css"><!-- Baloo 2 + Nunito embarquees : impression hors ligne OK -->
<style>
  /* ── Tokens PeakCL (design system v2) ───────────────────────── */
  :root{
    --indigo:#13004D; --violet:#360099; --violet-mid:#5F3AB9; --lavande:#BABAFF;
    --lavande-fonce:#875FD5; --bleu:#427CFF; --bleu-clair:#94D4FF;
    --turquoise:#96F0F7; --turquoise-fonce:#4DAFC9; --jaune:#F2D04B; --jaune-clair:#F2EB96;
    --creme:#FFEAA9; --blanc:#FFFFFF; --muted:#574F82;
    --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
    --body:"Nunito", ui-sans-serif, system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#E6E4F5;}
  body{font-family:var(--body); -webkit-print-color-adjust:exact; print-color-adjust:exact;}

  /* ── Format : 85x55 mm + 3 mm de fond perdu ─────────────────── */
  @page{ size:91mm 61mm; margin:0; }

  .card{
    position:relative; width:91mm; height:61mm; overflow:hidden;
    display:block; color:var(--indigo);
  }
  /* zone de sécurité : 3 mm de fond perdu + 5 mm de marge intérieure */
  .safe{ position:absolute; inset:8mm; display:flex; }

  /* ── RECTO ──────────────────────────────────────────────────── */
  .recto{
    background:
      radial-gradient(circle at 28% 26%, #3A07A8 0%, #2E0296 55%, #250085 100%);
    color:#fff;
  }
  .blob{ position:absolute; border-radius:999px; filter:blur(14mm); opacity:.55; }
  .blob-t{ width:46mm; height:46mm; left:-14mm; top:-16mm; background:var(--turquoise-fonce); }
  .blob-v{ width:52mm; height:52mm; right:-16mm; bottom:-20mm; background:var(--lavande-fonce); }
  .blob-j{ width:26mm; height:26mm; right:26mm; top:-12mm; background:var(--jaune); opacity:.30; }
  .blob-m{ width:34mm; height:34mm; right:-4mm; bottom:2mm; background:var(--turquoise-fonce); opacity:.38; }

  /* mosaïque de carrés arrondis, légèrement désaxée */
  .mosaic{ position:absolute; right:4.5mm; top:3.5mm; transform:rotate(-3deg); display:grid;
           grid-template-columns:repeat(3,3.4mm); gap:1.1mm; opacity:.9; }
  .mosaic i{ display:block; width:3.4mm; height:3.4mm; border-radius:1mm; }

  .recto .safe{ flex-direction:column; justify-content:space-between; }
  .logo-carre{ width:16mm; height:auto; display:block; }
  .baseline{
    font-family:var(--display); font-weight:700; font-size:12.5pt; line-height:1.06;
    letter-spacing:-.01em; max-width:47mm;
  }
  .baseline em{ font-style:normal; color:var(--jaune); }
  .sous-baseline{
    margin-top:1.8mm; font-size:6.4pt; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--lavande);
  }
  .mascotte-recto{
    position:absolute; right:2.5mm; bottom:4.4mm; height:43mm; width:auto; display:block;
  }
  /* bande de couleurs : 1.6 mm visibles après coupe, le reste part au fond perdu */
  .filet{ position:absolute; left:0; right:0; bottom:0; height:4.6mm; display:flex; }
  .filet i{ flex:1; }

  /* ── VERSO ──────────────────────────────────────────────────── */
  .verso{ background:var(--creme); }
  .verso .safe{ align-items:stretch; gap:5mm; }
  .col-infos{ flex:1; display:flex; flex-direction:column; }
  .logotype{ width:27mm; height:auto; display:block; }
  .nom{ font-family:var(--display); font-weight:700; font-size:13pt; line-height:1.05;
        letter-spacing:-.01em; margin-top:auto; }
  .role{ font-size:7.4pt; line-height:1.35; color:var(--muted); margin-top:.8mm; }
  .contacts{ margin-top:3mm; display:grid; gap:1.35mm; }
  .contacts a, .contacts span{ color:var(--indigo); text-decoration:none; }
  .ligne{ display:flex; align-items:center; gap:1.8mm; font-size:7.6pt; line-height:1.15; }
  .ligne svg{ width:3.1mm; height:3.1mm; flex:none; color:var(--lavande-fonce); }

  .col-qr{ width:25mm; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .qr-carte{
    width:25mm; background:var(--blanc); border-radius:3.2mm; padding:2mm 2mm 1.6mm;
    box-shadow:0 1mm 3mm rgba(19,0,77,.12); text-align:center;
  }
  .qr-carte img{ width:100%; height:auto; display:block; }
  .qr-legende{ margin-top:1.2mm; font-family:var(--display); font-weight:700;
               font-size:6.4pt; line-height:1.1; color:var(--indigo); }
  .puces{ margin-top:2mm; display:flex; gap:1.1mm; }
  .puces i{ width:2.6mm; height:2.6mm; border-radius:.8mm; display:block; }

  /* ── Repères de coupe (écran seulement) ─────────────────────── */
  .trim{ position:absolute; inset:3mm; border:.2mm dashed rgba(19,0,77,.35); pointer-events:none; }
  .verso .trim{ border-color:rgba(19,0,77,.3); }
  .recto .trim{ border-color:rgba(255,255,255,.35); }

  @media screen{
    body{ padding:10mm; display:flex; flex-wrap:wrap; gap:10mm; }
    .card{ box-shadow:0 4mm 12mm rgba(19,0,77,.22); border-radius:1mm; }
  }
  @media print{
    body{ padding:0; }
    .trim{ display:none; }
    .card{ break-after:page; page-break-after:always; }
    .card:last-child{ break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>

<!-- ══════════════════ RECTO ══════════════════ -->
<section class="card recto">
  <span class="blob blob-t"></span>
  <span class="blob blob-v"></span>
  <span class="blob blob-j"></span>
  <span class="blob blob-m"></span>

  <div class="mosaic">
    <i style="background:#94D4FF"></i><i style="background:#96F0F7"></i><i style="background:#BABAFF"></i>
    <i style="background:#F2D04B"></i><i style="background:#875FD5"></i><i style="background:#4DAFC9"></i>
  </div>

  <img class="mascotte-recto" src="../assets/mascotte-salut.svg" alt="">

  <div class="safe">
    <img class="logo-carre" src="../assets/logo-carre-fond-fonce.svg" alt="PeakCL">
    <div>
      <p class="baseline">Votre présence en ligne,<br><em>simplifiée.</em></p>
      <p class="sous-baseline">Web · Design · Réseaux — Savoie</p>
    </div>
  </div>

  <div class="filet">
    <i style="background:#94D4FF"></i><i style="background:#96F0F7"></i><i style="background:#BABAFF"></i>
    <i style="background:#875FD5"></i><i style="background:#F2D04B"></i>
  </div>

  <span class="trim"></span>
</section>

<!-- ══════════════════ VERSO ══════════════════ -->

          <a href="tel:+33743517627">07&nbsp;43&nbsp;51&nbsp;76&nbsp;27</a>

  </div>
  <span class="trim"></span>
</section>

</body>
</html>
