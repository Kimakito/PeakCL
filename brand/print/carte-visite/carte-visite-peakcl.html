<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de visite — PeakCL · Charlotte Lacroix</title>
<!--
  Carte de visite PeakCL « premium » — 85 x 55 mm + 3 mm de fond perdu (page 91 x 61 mm).
  Page 1 = recto · Page 2 = verso. Les deux faces sont indigo profond.
  Finitions prévues chez l'imprimeur : angles arrondis R = 3 mm (découpe à la forme),
  éléments jaunes = dorure à chaud or (option), motif de fond = gaufrage à sec (option).
  Le décor est en SVG : viewBox 0 0 91 61, donc 1 unité SVG = 1 mm de page.
  Export : Chrome > Imprimer > Enregistrer au format PDF, marges "aucune",
  "Graphiques d'arrière-plan" coché, échelle 100 %.
-->
<link rel="stylesheet" href="../assets/fonts.css"><!-- Baloo 2 + Nunito embarquees : impression hors ligne OK -->
<style>
  /* ── Tokens PeakCL (design system v2) ───────────────────────── */
  :root{
    --indigo:#13004D; --indigo-profond:#0C0033; --violet:#360099; --violet-mid:#5F3AB9;
    --lavande:#BABAFF; --lavande-fonce:#875FD5; --bleu:#427CFF; --bleu-clair:#94D4FF;
    --turquoise:#96F0F7; --turquoise-fonce:#4DAFC9;
    --or:#F2D04B; --or-clair:#F7E9A8; --or-fonce:#D6A02A; --creme:#FFEAA9; --blanc:#FFFFFF;
    --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
    --body:"Nunito", ui-sans-serif, system-ui, sans-serif;
    --rayon:3mm;            /* rayon de la découpe à la forme */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#2A2733;}
  body{font-family:var(--body); color:var(--blanc); -webkit-print-color-adjust:exact; print-color-adjust:exact;}

  /* ── Format : 85x55 mm + 3 mm de fond perdu ─────────────────── */
  @page{ size:91mm 61mm; margin:0; }

  .card{ position:relative; width:91mm; height:61mm; overflow:hidden; background:var(--indigo-profond); }
  .deco{ position:absolute; inset:0; width:91mm; height:61mm; display:block; }
  .layer{ position:absolute; inset:0; }
  .kicker{ font-size:6.1pt; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
  .or{ color:var(--or); }

  /* Repères écran : fond perdu 3 mm + tracé de découpe arrondi R 3 mm */
  .trim{
    position:absolute; inset:3mm; border:.2mm dashed rgba(242,208,75,.55);
    border-radius:var(--rayon); pointer-events:none;
  }
  /* zone de sécurité : 5 mm depuis le bord fini */
  .safe{
    position:absolute; inset:8mm; border:.2mm dotted rgba(186,186,255,.30);
    border-radius:1.5mm; pointer-events:none;
  }

  /* ── RECTO ──────────────────────────────────────────────────── */
  .bloc-logo{
    position:absolute; left:0; right:0; top:10mm;
    display:flex; align-items:center; justify-content:center; gap:1mm;
  }
  .mascotte-recto{ width:24mm; display:block; filter:drop-shadow(0 .6mm 1.2mm rgba(0,0,0,.45)); }
  .logotype-or{ width:38mm; display:block; }
  .nom-recto{
    position:absolute; left:0; right:0; top:42.4mm; text-align:center;
    font-family:var(--display); font-weight:700; font-size:12.5pt; line-height:1.05;
    letter-spacing:-.005em; color:var(--or);
  }
  .role-recto{ position:absolute; left:0; right:0; top:48.8mm; text-align:center; color:var(--lavande); }

  /* ── VERSO ──────────────────────────────────────────────────── */
  .logotype-verso{ position:absolute; left:8mm; top:7.5mm; width:23mm; }
  .nom{ position:absolute; left:8mm; top:15.5mm;
        font-family:var(--display); font-weight:700; font-size:12pt; line-height:1.05;
        letter-spacing:-.005em; color:var(--or); }
  .role{ position:absolute; left:8mm; top:21.4mm; font-size:7pt; color:var(--lavande); }

  .contacts{ position:absolute; left:8mm; top:26.5mm; display:grid; gap:1.5mm; }
  .contacts a, .contacts span{ color:var(--blanc); text-decoration:none; }
  .ligne{ display:flex; align-items:center; gap:1.8mm; font-size:7.3pt; line-height:1.15; }
  .puce{
    width:4.2mm; height:4.2mm; flex:none; border-radius:50%;
    border:.22mm solid rgba(242,208,75,.55); background:rgba(242,208,75,.10);
    display:flex; align-items:center; justify-content:center;
  }
  .puce svg{ width:2.4mm; height:2.4mm; color:var(--or); }
  .reseaux{
    position:absolute; left:8mm; bottom:7.2mm; display:flex; align-items:center; gap:2.6mm;
    font-size:6.4pt; color:var(--lavande);
  }
  .reseaux span{ display:flex; align-items:center; gap:1mm; }
  .reseaux svg{ width:2.6mm; height:2.6mm; color:var(--or); flex:none; }

  .qr-carte{
    position:absolute; right:7mm; top:50%; transform:translateY(-50%);
    width:23mm; background:var(--blanc); border-radius:2.6mm; padding:1.8mm 1.8mm 1.4mm;
    text-align:center; box-shadow:0 .8mm 2.4mm rgba(0,0,0,.38);
  }
  .qr-carte img{ width:100%; display:block; }
  .qr-legende{ margin-top:1mm; font-family:var(--display); font-weight:700;
               font-size:6.1pt; line-height:1.1; color:var(--indigo); }

  @media screen{
    body{ padding:12mm; display:flex; flex-wrap:wrap; gap:12mm; }
    /* aperçu réaliste : coins arrondis + ombre. En impression la page reste rectangulaire. */
    .card{ border-radius:calc(var(--rayon) + 3mm); box-shadow:0 5mm 14mm rgba(0,0,0,.45); }
  }
  @media print{
    body{ padding:0; }
    .trim, .safe{ display:none; }
    .card{ border-radius:0; box-shadow:none; break-after:page; page-break-after:always; }
    .card:last-child{ break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>

        <path transform="translate(46,22) scale(.55)"
              d="M97.90,46.30C98.39,59.28 87.61,83.01 78.74,90.74C69.87,98.47 55.54,95.67 44.69,92.70C33.84,89.72 18.80,83.49 13.64,72.88C8.47,62.28 9.16,39.83 13.70,29.04C18.24,18.25 30.53,10.84 40.89,8.14C51.24,5.44 66.32,6.49 75.83,12.85C85.33,19.21 97.42,33.32 97.90,46.30Z"/>
      </g>
    </defs>

    <rect width="91" height="61" fill="url(#fondR)"/>
    <rect width="91" height="61" fill="url(#halo)"/>

    <!-- gaufrage : ombre portée puis lumière rasante -->
    <use href="#blobsR" x=".18" y=".18" stroke="#05001A" opacity=".55"/>
    <use href="#blobsR" x="-.18" y="-.18" stroke="#8E7BE0" opacity=".22"/>

    <!-- filet or sous le bloc logo -->
    <rect x="39" y="40.2" width="38" height=".28" fill="url(#filetOr)"/>
  </svg>

  <div class="layer">
    <div class="bloc-logo">
      <img class="mascotte-recto" src="../assets/mascotte-joie.png" alt="">
      <img class="logotype-or" src="../assets/logotype-horizontal-or.svg" alt="PeakCL">
    </div>
    <p class="nom-recto">Charlotte Lacroix</p>
    <p class="kicker role-recto">Web · Design · Réseaux — Savoie</p>
  </div>

  <span class="safe"></span>
  <span class="trim"></span>
</section>
