<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de visite — PeakCL · Charlotte Lacroix</title>
<!--
  Carte de visite PeakCL — 85 x 55 mm + 3 mm de fond perdu (page 91 x 61 mm).
  Page 1 = recto (indigo) · Page 2 = verso (crème).
  Le décor est en SVG : viewBox 0 0 91 61, donc 1 unité SVG = 1 mm de page.
  Export : Chrome > Imprimer > Enregistrer au format PDF, marges "aucune",
  "Graphiques d'arrière-plan" coché, échelle 100 %.
-->
<link rel="stylesheet" href="../assets/fonts.css"><!-- Baloo 2 + Nunito embarquees : impression hors ligne OK -->
<style>
  /* ── Tokens PeakCL (design system v2) ───────────────────────── */
  :root{
    --indigo:#13004D; --violet:#360099; --violet-mid:#5F3AB9; --lavande:#BABAFF;
    --lavande-fonce:#875FD5; --bleu:#427CFF; --bleu-clair:#94D4FF;
    --turquoise:#96F0F7; --turquoise-fonce:#4DAFC9; --jaune:#F2D04B; --jaune-clair:#F2EB96;
    --creme:#FFEAA9; --blanc:#FFFFFF; --muted:#574F82;
    --display:"Baloo 2", ui-rounded, system-ui, sans-serif;
    --body:"Nunito", ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#E6E4F5;}
  body{font-family:var(--body); color:var(--indigo); -webkit-print-color-adjust:exact; print-color-adjust:exact;}

  /* ── Format : 85x55 mm + 3 mm de fond perdu ─────────────────── */
  @page{ size:91mm 61mm; margin:0; }

  .card{ position:relative; width:91mm; height:61mm; overflow:hidden; }
  .deco{ position:absolute; inset:0; width:91mm; height:61mm; display:block; }
  .layer{ position:absolute; inset:0; }
  .kicker{ font-size:6.2pt; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
  /* liseré de coupe, écran seulement : 3 mm de fond perdu + 5 mm de marge utile */
  .trim{ position:absolute; inset:3mm; border:.2mm dashed rgba(19,0,77,.35); pointer-events:none; }

  /* ── RECTO ──────────────────────────────────────────────────── */
  .recto{ background:#1B0068; color:#fff; }
  .logo-carre{ position:absolute; left:8mm; top:7.5mm; width:13mm; }
  .baseline{
    position:absolute; left:8mm; bottom:9mm; width:46mm;
    font-family:var(--display); font-weight:700; font-size:12.5pt; line-height:1.06;
    letter-spacing:-.01em;
  }
  .baseline em{ font-style:normal; color:var(--jaune); }
  .sous-baseline{ position:absolute; left:8mm; bottom:5mm; color:var(--lavande); }
  .mascotte-recto{ position:absolute; right:4.5mm; bottom:3.5mm; width:33mm; }

  /* ── VERSO ──────────────────────────────────────────────────── */
  .verso{ background:var(--creme); }
  .logotype{ position:absolute; left:8mm; top:8mm; width:26mm; }
  .nom{ position:absolute; left:8mm; top:20mm;
        font-family:var(--display); font-weight:700; font-size:13pt; line-height:1.05;
        letter-spacing:-.01em; }
  .role{ position:absolute; left:8mm; top:26.5mm; font-size:7.4pt; line-height:1.35; color:var(--muted); }
  .contacts{ position:absolute; left:8mm; bottom:7.5mm; display:grid; gap:1.35mm; }
  .contacts a, .contacts span{ color:var(--indigo); text-decoration:none; }
  .ligne{ display:flex; align-items:center; gap:1.8mm; font-size:7.6pt; line-height:1.15; }
  .ligne svg{ width:3.1mm; height:3.1mm; flex:none; color:var(--lavande-fonce); }

  .qr-carte{
    position:absolute; right:6.5mm; top:50%; transform:translateY(-50%);
    width:25mm; background:var(--blanc); border-radius:5mm 5mm 5mm 1.8mm; padding:2mm 2mm 1.6mm;
    box-shadow:0 1mm 3mm rgba(19,0,77,.14); text-align:center;
  }
  .qr-carte img{ width:100%; display:block; }
  .qr-legende{ margin-top:1.2mm; font-family:var(--display); font-weight:700;
               font-size:6.4pt; line-height:1.1; color:var(--indigo); }

  @media screen{
    body{ padding:10mm; display:flex; flex-wrap:wrap; gap:10mm; }
    .card{ box-shadow:0 4mm 12mm rgba(19,0,77,.22); }
  }
  @media print{
    body{ padding:0; }
    .trim{ display:none; }
    .card{ break-after:page; page-break-after:always; }
    .card:last-child{ break-after:auto; page-break-after:auto; }
  }
</style>
</head>
<body>

  </svg>

  <div class="layer">
    <img class="logo-carre" src="../assets/logo-carre-fond-fonce.svg" alt="PeakCL">
    <img class="mascotte-recto" src="../assets/mascotte-joie.png" alt="">
    <p class="baseline">Votre présence en ligne,<br><em>simplifiée.</em></p>
    <p class="kicker sous-baseline">Web · Design · Réseaux — Savoie</p>
  </div>

  <span class="trim" style="border-color:rgba(255,255,255,.35)"></span>
</section>
